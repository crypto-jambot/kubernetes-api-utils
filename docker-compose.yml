---
version: '3.4'
services:
  teku_node:
    environment:
      - "JAVA_OPTS=-Xmx4g"
    image: consensys/teku:latest
    command: [
      "--data-base-path=/var/lib/teku/data",
      "--ee-endpoint=http://localhost:8551",
      "--ee-jwt-secret-file=/var/lib/teku/secrets/jwtsecret.hex",
      "--rest-api-enabled=true",
      "--metrics-enabled=true",
      "--log-destination=console",
      "--initial-state=https://mainnet-checkpoint-sync.attestant.io//eth/v2/debug/beacon/states/finalized",
      "--rest-api-host-allowlist=*",
      "--metrics-host-allowlist=*",
      "--rest-api-interface=0.0.0.0",
      "--rest-api-port=5051",
      "--metrics-port=8008",
      "--metrics-interface=0.0.0.0"
    ]
    volumes:
      - ./media/jam/Data/nodes/ethereum/mainnet/data/teku:/var/lib/teku/data
      - ./media/jam/Data/nodes/ethereum/mainnet:/var/lib/teku/secrets
    ports:
      # Map the p2p port(9000) and REST API port(5051)
      - "9000:9000/tcp"
      - "9000:9000/udp"
      - "5051:5051"